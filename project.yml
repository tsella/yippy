name: YiCamera
options:
  bundleIdPrefix: com.example
targets:
  YiCamera:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        NSPhotoLibraryAddUsageDescription: "Save downloaded photos to your library."
        NSLocalNetworkUsageDescription: "Connect to the Xiaomi Yi Action Camera."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
