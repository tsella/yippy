<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0062FF" />
    </linearGradient>

    <mask id="shutterMask">
      <rect x="0" y="0" width="1024" height="1024" fill="white" />
      <circle cx="512" cy="512" r="140" fill="black" />
      <!-- Shutter blades -->
      <g stroke="black" stroke-width="26" stroke-linecap="round">
        <line x1="512" y1="372" x2="880" y2="372" transform="rotate(0 512 512)" />
        <line x1="512" y1="372" x2="880" y2="372" transform="rotate(60 512 512)" />
        <line x1="512" y1="372" x2="880" y2="372" transform="rotate(120 512 512)" />
        <line x1="512" y1="372" x2="880" y2="372" transform="rotate(180 512 512)" />
        <line x1="512" y1="372" x2="880" y2="372" transform="rotate(240 512 512)" />
        <line x1="512" y1="372" x2="880" y2="372" transform="rotate(300 512 512)" />
      </g>
    </mask>

    <path id="textCircle" d="M 512, 110 A 402, 402 0 1,1 511.9, 110" fill="none" />
  </defs>

  <!-- Background is explicitly transparent (no background rect) -->

  <!-- Shutter Icon -->
  <circle cx="512" cy="512" r="330" fill="url(#brandGrad)" mask="url(#shutterMask)" />

  <!-- Circular Text Wrapper -->
  <text font-family="system-ui, -apple-system, sans-serif" font-size="95" font-weight="900" fill="url(#brandGrad)" letter-spacing="12">
    <!-- Repeating the word to perfectly encircle the path -->
    <textPath href="#textCircle" startOffset="0%" textLength="2520" lengthAdjust="spacingAndGlyphs">
      YIPPY! • YIPPY! • YIPPY! • YIPPY! • YIPPY! • YIPPY! • 
    </textPath>
  </text>
</svg>
